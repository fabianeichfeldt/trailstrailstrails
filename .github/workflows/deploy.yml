name: Build and Deploy

on:
  # Run the test + build jobs on every branch push. Only pushes to `main`
  # continue on to the deploy job automatically (see the `deploy` job's `if`).
  push:
    tags-ignore:
      - '**'
  # Manual "Run workflow" button (Actions tab): pick any branch to build AND
  # deploy it to production Pages — used to smoke-test a feature branch live.
  # To roll back, run it again on `main`.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-branch: a newer push to the same branch cancels its own in-flight run,
# but different branches never cancel each other. The deploy job additionally
# serialises on a global `pages` group (below) so concurrent deploys can't race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install
      - run: npx nuxt prepare

      - name: Unit tests (Vitest)
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps only
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install
      - run: npm run generate

      - name: Verify static build (no live server dependency)
        run: node scripts/verify-static-build.mjs --skip-build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    # Deploy automatically only on `main`. Any other branch deploys only when
    # a run is started by hand from the Actions tab ("Run workflow").
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v5
